<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Markdown Workspace — a local-first documentation browser, editor and library that lives entirely in your browser." />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Markdown Workspace</title>
    <!-- Restores the real path after the public/404.html GitHub Pages SPA-fallback redirect. -->
    <script>
      ;(function (l) {
        if (l.search[1] === 'p' && l.search[2] === '=') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
          var params = {}
          decoded.forEach(function (pair) {
            var idx = pair.indexOf('=')
            params[pair.slice(0, idx)] = pair.slice(idx + 1)
          })
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + (params.p || '') + (l.hash || (params.h ? '#' + params.h : '')))
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
